name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Evals
        run: npm run eval

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vale
        run: |
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz -o vale.tgz
          tar -xzf vale.tgz vale
          install -m 0755 vale /usr/local/bin/vale
          vale --version
      - name: Fetch write-good styles
        run: |
          git clone -q --depth=1 https://github.com/errata-ai/write-good .vale/styles/write-good
          cd .vale/styles/write-good
          if [ -d write-good ]; then mv write-good/* .; rmdir write-good; fi
          find . -maxdepth 1 -name '*.yml' | while read f; do grep -q extends "$f" || rm "$f"; done
      - name: Docs prose lint
        run: vale README.md docs/adr/*.md docs/live-view.md tickets/README.md
