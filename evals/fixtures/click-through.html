<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Counter</title></head>
  <body>
    <h1>Counter</h1>
    <p>One drink, one button.</p>
    <button id="order">Order latte</button>
    <p id="status" role="status"></p>
    <script>
      document.getElementById("order").addEventListener("click", () => {
        document.getElementById("status").textContent = "Latte ordered. Thank you!";
      });
    </script>
  </body>
</html>
